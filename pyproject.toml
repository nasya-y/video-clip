[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-compilation-maker"
version = "1.0.2"
description = "Offline Windows desktop app that builds 30-second highlight compilations from local videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "Pillow>=10",
    "PySide6-Essentials>=6.6",
]

[project.scripts]
video-compilation-maker = "vcm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 1800
markers = [
    "slow: long running integration tests",
    "gui: tests that create Qt widgets",
]

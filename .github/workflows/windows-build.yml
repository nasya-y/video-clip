name: Windows build and test

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      VCM_VERSION: "1.0.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip list

      - name: Download FFmpeg for Windows (x64, GPL build with libx264)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python packaging/fetch_ffmpeg.py
          vendor/ffmpeg/bin/ffmpeg.exe -hide_banner -version

      - name: Run the automated test suite on Windows
        id: tests
        continue-on-error: true
        env:
          VCM_FFMPEG_DIR: ${{ github.workspace }}\vendor\ffmpeg\bin
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -v -p no:cacheprovider --junitxml=test-results/junit-windows.xml --durations=30 2>&1 | Tee-Object -FilePath test-results/pytest-windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the application with PyInstaller
        run: |
          python packaging/collect_licenses.py
          python -m PyInstaller packaging/vcm.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller
          Get-ChildItem dist/VideoCompilationMaker | Format-Table Name, Length
          "{0:N0} MB" -f ((Get-ChildItem dist/VideoCompilationMaker -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Test the packaged .exe (self-test with real processing + GUI start)
        run: |
          $exe = "dist/VideoCompilationMaker/VideoCompilationMaker-cli.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          $env:VCM_DATA_DIR = "$PWD\smoke-data"
          & $exe --self-test "$PWD\selftest-exe" --log-file "$PWD\test-results\selftest-exe.log"
          $code = $LASTEXITCODE
          Get-Content selftest-exe\selftest_result.json
          if ($code -ne 0) { throw "packaged self-test failed" }
          Select-String -Path "test-results\selftest-exe.log" -Pattern "Using ffmpeg version" | Select-Object -First 1
          $p = Start-Process -FilePath "dist/VideoCompilationMaker/VideoCompilationMaker.exe" -ArgumentList "--gui-smoke", "`"$PWD\test-results\screenshot-gui-windows.png`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI exited with $($p.ExitCode)" }
          if (-not (Test-Path "test-results\screenshot-gui-windows.png")) { throw "GUI screenshot missing" }

      - name: Build the installer (Inno Setup)
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VCM_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length

      - name: Test the installer (silent install, run installed app, uninstall)
        run: |
          $setup = "dist\VideoCompilationMaker-Setup-$env:VCM_VERSION.exe"
          $dir = "$env:RUNNER_TEMP\VCM install test"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/LOG=`"$PWD\test-results\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\VideoCompilationMaker.exe")) { throw "app not installed" }
          $env:VCM_DATA_DIR = "$PWD\installed-data"
          & "$dir\VideoCompilationMaker-cli.exe" --self-test "$PWD\selftest-installed"
          if ($LASTEXITCODE -ne 0) { Get-Content selftest-installed\selftest_result.json; throw "installed self-test failed" }
          "installed self-test passed"
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\VideoCompilationMaker.exe"); $i++) { Start-Sleep 2 }
          if (Test-Path "$dir\VideoCompilationMaker.exe") { throw "uninstaller did not remove the app" }
          "uninstall OK"

      - name: Portable ZIP and sample output
        if: always()
        run: |
          if (Test-Path dist/VideoCompilationMaker) {
            Compress-Archive -Path dist/VideoCompilationMaker -DestinationPath "dist/VideoCompilationMaker-$env:VCM_VERSION-portable-win64.zip" -CompressionLevel Optimal
          }
          New-Item -ItemType Directory -Force sample-output | Out-Null
          if (Test-Path selftest-exe/output) { Copy-Item -Recurse selftest-exe/output/* sample-output/ }
          if (Test-Path selftest-exe/selftest_result.json) { Copy-Item selftest-exe/selftest_result.json test-results/ }
          if (Test-Path vendor/ffmpeg/BUILD_INFO.json) { Copy-Item vendor/ffmpeg/BUILD_INFO.json test-results/ffmpeg-build-info.json }

      - name: Print key results to the log
        if: always()
        run: python packaging/ci_log_summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: |
            test-results/
            sample-output/

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCompilationMaker-Setup
          path: dist/VideoCompilationMaker-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCompilationMaker-portable
          path: dist/VideoCompilationMaker-*-portable-win64.zip

      - name: Fail the job if any automated test failed
        if: steps.tests.outcome != 'success'
        run: |
          Write-Error "The automated test suite failed - see the 'Run the automated test suite' step"
          exit 1

      - name: Publish GitHub release
        if: steps.tests.outcome == 'success' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VCM_VERSION }}
          name: Video Compilation Maker ${{ env.VCM_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/release_notes.md
          files: |
            dist/VideoCompilationMaker-Setup-${{ env.VCM_VERSION }}.exe
            dist/VideoCompilationMaker-${{ env.VCM_VERSION }}-portable-win64.zip
